name: Construire AURA APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AURA_ANDROID_PROJET.zip"
      - ".github/workflows/build-aura.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraire le projet AURA
        run: |
          unzip -o AURA_ANDROID_PROJET.zip -d .

            - name: Corriger la compatibilite Java et Kotlin
        run: |
          sed -i '/^android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' app/build.gradle.kts

      - name: Compiler AURA
        run: gradle assembleDebug --no-daemon

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
